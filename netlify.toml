# Netlify build settings kept in the repo (mirrors the site dashboard config).
# The app lives in client/ — there is no package.json at the repo root.

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# same major as .github/workflows/ci.yml so CI and Netlify build identically
[build.environment]
  NODE_VERSION = "22"

# crawlers asking for /favicon.ico get the real SVG favicon instead of the
# SPA fallback (an HTML page served with 200)
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 301

# SPA fallback so deep links such as /projects render instead of 404ing.
# Same rule as client/public/_redirects, kept here so it survives an empty public/ folder.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for every page.
# - HSTS matches the value Netlify serves by default — stated here so the
#   full security posture lives in one reviewable file.
# - script-src allows 'self' plus ONE hash: the inline JSON-LD block in
#   client/index.html. Editing that block without refreshing the hash
#   silently blocks structured data, so CI runs the verifier — after
#   changing the JSON-LD run `node client/scripts/verify-csp-hash.mjs --fix`
#   from the repo root and commit both files.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-N1CXrg3uwhF7+xmTlhu12dpLkxaXv71/0AyW+H8xXOo='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com https://autodev-kappa.vercel.app; font-src 'self'; connect-src 'self' https://api.emailjs.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
