# Keeps npm dependencies and GitHub Actions current automatically.
# npm lives in client/ (the repo root has no package.json).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # eslint 10 is blocked upstream: eslint-plugin-react (latest 7.37.5)
    # declares peer eslint <=9, so bumping eslint/@eslint/js to 10 makes
    # `npm ci` fail with ERESOLVE. Remove this ignore once a release of
    # eslint-plugin-react declares eslint 10 support.
    ignore:
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/*"
        versions: [">=10"]
    groups:
      # These packages only work in pairs: @eslint/js 10 needs eslint 10,
      # @vitejs/plugin-react 6 needs vite 8, react 19 needs react-dom 19.
      # Bumping one half alone makes `npm ci` fail with ERESOLVE, so they
      # are always updated in the same PR and reviewed together.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "globals"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
      # everything else lands here, one PR at a time
      remaining-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
