name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening); Dependabot
      # (.github/dependabot.yml) keeps the pins — and their version comments — fresh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm ci also fails if package.json and package-lock.json drift apart
      - run: npm ci

      # fail the build on high/critical advisories before doing real work
      - run: npm audit --audit-level=high

      - run: npm run lint

      # the build needs no secrets: missing VITE_EMAILJS_* only disables the
      # contact form (see client/.env.example)
      - run: npm run build

      # catch a build that "succeeds" without producing the files the
      # deploy (netlify.toml) and SEO (sitemap) depend on
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/favicon.svg

      # the CSP in netlify.toml allows the inline JSON-LD by hash — a content
      # change without a hash refresh would silently block structured data
      - name: Verify CSP hash matches JSON-LD
        run: node scripts/verify-csp-hash.mjs

      # update-sitemap.mjs stamps <lastmod> during the build; make sure it ran
      - name: Verify sitemap lastmod is current
        run: grep -q "<lastmod>$(date -u +%F)</lastmod>" dist/sitemap.xml
