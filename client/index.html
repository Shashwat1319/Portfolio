<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shashwat Srivastava | MERN Stack Developer Portfolio</title>
    <!-- SEO baseline for crawlers that don't run JS. The tags marked
         data-rh="true" are also managed by react-helmet-async (RouteMeta in
         App.jsx): on hydration the library claims them and removes/replaces
         them per route, so routes don't end up with duplicate canonicals or
         an index+noindex robots pair. og:locale / og:image:width / height
         are not Helmet-managed and intentionally carry no data-rh. -->
    <meta name="description" content="Full-Stack & Backend Engineer specializing in MERN applications, scalable APIs, and automation. Based in Lucknow, India." data-rh="true" />
    <meta name="author" content="Shashwat Srivastava" />
    <meta name="robots" content="index, follow" data-rh="true" />
    <meta name="theme-color" content="#020617" />

    <!-- Open Graph -->
    <meta property="og:title" content="Shashwat Srivastava | MERN Stack Developer Portfolio" data-rh="true" />
    <meta property="og:description" content="Full-Stack & Backend Engineer specializing in MERN applications, scalable APIs, and automation. Based in Lucknow, India." data-rh="true" />
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://shashwat-srivastava.netlify.app/" data-rh="true" />
    <meta property="og:image" content="https://shashwat-srivastava.netlify.app/og-image.jpg" data-rh="true" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:title" content="Shashwat Srivastava | MERN Stack Developer Portfolio" data-rh="true" />
    <meta name="twitter:description" content="Full-Stack & Backend Engineer specializing in MERN applications, scalable APIs, and automation. Based in Lucknow, India." data-rh="true" />
    <meta name="twitter:image" content="https://shashwat-srivastava.netlify.app/og-image.jpg" data-rh="true" />

    <!-- Canonical -->
    <link rel="canonical" href="https://shashwat-srivastava.netlify.app/" data-rh="true" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Preconnect for remote images (project thumbnails + AutoDev badge) -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://autodev-kappa.vercel.app" />

    <!-- JSON-LD Structured Data: one @graph so Google links the Person entity
         (the name people search) to this site (the result we want to rank) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://shashwat-srivastava.netlify.app/#person",
            "name": "Shashwat Srivastava",
            "description": "Full-Stack & Backend Engineer specializing in MERN applications, scalable APIs, and automation. Based in Lucknow, India.",
            "image": "https://shashwat-srivastava.netlify.app/myphoto.jpg",
            "jobTitle": "MERN Stack Developer",
            "alumniOf": "Computer Science & Engineering, B-Tech",
            "knowsAbout": ["MERN Stack", "React", "Node.js", "MongoDB", "Express.js", "JavaScript", "REST APIs", "Git", "Tailwind CSS"],
            "url": "https://shashwat-srivastava.netlify.app/",
            "sameAs": [
              "https://github.com/Shashwat1319",
              "https://www.linkedin.com/in/shashwatsrivastava131/",
              "https://x.com/Shashwat8965"
            ],
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Lucknow",
              "addressCountry": "India"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://shashwat-srivastava.netlify.app/#website",
            "url": "https://shashwat-srivastava.netlify.app/",
            "name": "Shashwat Srivastava",
            "description": "Portfolio of Shashwat Srivastava — MERN Stack Developer specializing in MERN applications, scalable APIs, and automation.",
            "inLanguage": "en",
            "publisher": { "@id": "https://shashwat-srivastava.netlify.app/#person" }
          },
          {
            "@type": "ProfilePage",
            "@id": "https://shashwat-srivastava.netlify.app/#profilepage",
            "url": "https://shashwat-srivastava.netlify.app/",
            "mainEntity": { "@id": "https://shashwat-srivastava.netlify.app/#person" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
